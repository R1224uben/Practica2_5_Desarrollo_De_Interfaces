<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Entrada discoteca</title>
  <link rel="stylesheet" href="Formulario.css" />
</head>
<body>
  
  <div id="contenedorPrincipal">
    <main class="card">
      <h1 id="titulo">Entrada discoteca</h1>
      <p id="status" aria-live="polite"></p>

      <form id="formMatricula">
    
        <label>
          Nombre y apellidos
          <input id="nombre" name="nombre" type="text" autocomplete="name" />
        </label>
        <small class="msg" id="msgNombre"></small>

        <label>
          Número de teléfono
          <input placeholder="+34 600 00 00 00" id="numTelf" name="numTelf" type="number"/>
        </label>
        <small class="msg" id="msgEdad"></small>

        <label>
          Email
          <input id="email" name="email" type="email" autocomplete="email" />
        </label>
        <small class="msg" id="msgEmail"></small>

        <label>
          Discoteca
          <select id="discoteca" name="discoteca">
            <option value="">-- Selecciona una discoteca --</option>
            <option value="copernico">Copérnico</option>
            <option value="nuit">Nuit</option>
            <option value="fabrik">Fabrik</option>
            <option value="mon">Mon</option>
            <option value="chapan">El Chapandaz</option>
          </select>
        </label>
        <small class="msg" id="msgDiscoteca"></small>

        <label>
          Observaciones
          <textarea id="obs" name="obs" rows="3"></textarea>
        </label>

        <section class="radio-section">    
          <fieldset class="radio-group">
            <legend>Tipo de entrada</legend>
            <label class="radio-card">
              <input type="radio" name="entrada" value="15">
              <span><strong>1 copa</strong><small>-- 15€</small></span>
            </label>
            <label class="radio-card">
              <input type="radio" name="entrada" value="20">
              <span><strong>2 copas</strong><small>-- 20€</small></span>
            </label>
            <label class="radio-card">
              <input type="radio" name="entrada" value="100">
              <span><strong>Botella + VIP</strong><small>-- 100€</small></span>
            </label>
            <label class="radio-card">
              <input type="radio" name="entrada" value="150">
              <span><strong>Botella Premium + VIP</strong><small>-- 150€</small></span>
            </label>
          </fieldset>
          <small class="msg" id="tipoEntrada"></small>
        </section>

        <div class="botonera">
          <button id="btnEnviar" type="submit">Enviar</button>
          <button id="btnReset" type="reset">Limpiar</button>
        </div>
      </form>
    </main>
  </div>

  <script src="Formulario.js"></script>
</body>
</html>
